<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Ana Beatriz 💜</title>

<link rel="manifest" href="manifest.json">

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#7b2ff7,#4a00e0);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:95%;
max-width:800px;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{text-align:center;color:#6a11cb}

#bar{
height:10px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin:20px 0;
}

#progress{
height:100%;
width:0%;
background:#6a11cb;
transition:.3s;
}

button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
cursor:pointer;
background:#eee;
transition:.2s;
}

button:hover{transform:scale(1.02);background:#6a11cb;color:white}

.correct{background:#2ecc71!important;color:white}
.wrong{background:#e74c3c!important;color:white}

.hidden{display:none}

.score{font-size:2.5rem;text-align:center;color:#6a11cb}

#ranking p{border-bottom:1px solid #eee;padding:5px}
</style>
</head>

<body>

<div class="container">

<h1>💜 Quiz da Ana Beatriz 💜</h1>

<div id="quiz">
<div id="bar"><div id="progress"></div></div>
<h2 id="question"></h2>
<div id="answers"></div>
</div>

<div id="result" class="hidden"></div>
<div id="ranking" class="hidden"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
limit
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA...",
authDomain: "quiz-da-bia.firebaseapp.com",
projectId: "quiz-da-bia",
storageBucket: "quiz-da-bia.firebasestorage.app",
messagingSenderId: "149961986529",
appId: "1:149961986529:web:dcee62b751115bdc8bc2a0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 👤 nome salvo
let nome = localStorage.getItem("nome");
if(!nome){
nome = prompt("Qual é seu nome? 💜") || "Anônimo";
localStorage.setItem("nome", nome);
}

// 🎯 estado
let atual = 0;
let pontos = 0;
let respostas = [];

// 🧠 20 perguntas (SUAS)
const perguntas = [
{pergunta:"Qual é o meu nome?",respostas_corretas:["ana beatriz","ana","ana b","anabeatriz"]},
{pergunta:"Quantos anos eu tenho?",respostas_corretas:["16","dezesseis"]},
{pergunta:"Em qual cidade eu moro?",respostas_corretas:["sao paulo","sp"]},
{pergunta:"Em qual região de São Paulo eu moro?",respostas_corretas:["zona leste","zl"]},
{pergunta:"Em qual ano do Ensino Médio eu estou?",respostas_corretas:["2","2 ano","2º ano","segundo"]},
{pergunta:"Qual especialização em medicina eu quero seguir no futuro?",respostas_corretas:["neurologia","neurologista"]},
{pergunta:"Qual matéria eu gosto bastante?",respostas_corretas:["matematica","math"]},
{pergunta:"Qual grupo de k-pop eu gosto?",respostas_corretas:["bts","bangtan"]},
{pergunta:"Com quantos anos eu fiz o Enem?",respostas_corretas:["15","quinze"]},
{pergunta:"Qual é minha data de aniversário completa?",respostas_corretas:["19/01/2010","19-01-2010","19 de janeiro de 2010"]},
{pergunta:"Quantos irmãos eu tenho?",respostas_corretas:["4","quatro"]},
{pergunta:"Qual é o nome do meu animal de estimação?",respostas_corretas:["enzo"]},
{pergunta:"Qual é minha rede social favorita?",respostas_corretas:["tiktok","tik tok"]},
{pergunta:"Qual é o meu signo?",respostas_corretas:["capricornio"]},
{pergunta:"Eu sou canhota ou destra?",respostas_corretas:["canhota","mao esquerda"]},
{pergunta:"Eu prefiro frio ou calor?",respostas_corretas:["frio"]},
{pergunta:"Qual é a cor dos meus olhos?",respostas_corretas:["castanho","castanhos"]},
{pergunta:"Eu prefiro maratonar série ou filme?",respostas_corretas:["serie","maratonar"]},
{pergunta:"Qual é minha cor favorita?",respostas_corretas:["roxo","lilas"]},
{pergunta:"Eu sou tímida ou extrovertida?",respostas_corretas:["timida","a","b","extrovertida"]}
];

// 🔥 carregar
function carregar(){
const p = perguntas[atual];

document.getElementById("question").innerText =
`(${atual+1}/20) ${p.pergunta}`;

document.getElementById("progress").style.width =
`${(atual/perguntas.length)*100}%`;

const div = document.getElementById("answers");
div.innerHTML = "";

p.respostas_corretas.forEach(op=>{

const b = document.createElement("button");
b.innerText = op;

b.onclick = ()=>responder(b,op,p);

div.appendChild(b);
});
}

// 🎯 responder
function responder(btn,op,p){

const certo = p.respostas_corretas.some(r =>
r.toLowerCase() === op.toLowerCase()
);

respostas.push({p:p.pergunta,op,certo:p.respostas_corretas[0]});

if(certo){
pontos++;
btn.classList.add("correct");
}else{
btn.classList.add("wrong");
}

setTimeout(()=>{
atual++;
if(atual<perguntas.length) carregar();
else fim();
},500);
}

// 💾 salvar
async function salvar(){
await addDoc(collection(db,"ranking"),{
nome,
pontos,
porcentagem: Math.round((pontos/perguntas.length)*100),
tempo: Date.now()
});
}

// 🏆 ranking
async function ranking(){

const q = query(collection(db,"ranking"),orderBy("pontos","desc"),limit(10));
const snap = await getDocs(q);

let html="<h2>🏆 Ranking</h2>";

let pos=1;

snap.forEach(d=>{

const data=d.data();

let medal = pos===1?"🥇":pos===2?"🥈":pos===3?"🥉":"";

html+=`<p>${medal} ${pos}. ${data.nome} — ${data.pontos}/20 (${data.porcentagem}%)</p>`;
pos++;
});

document.getElementById("ranking").innerHTML=html;
document.getElementById("ranking").classList.remove("hidden");
}

// 🎉 fim
async function fim(){

document.getElementById("quiz").classList.add("hidden");

const pct=Math.round((pontos/perguntas.length)*100);

document.getElementById("result").classList.remove("hidden");

document.getElementById("result").innerHTML=`
<h2>🎉 Final</h2>
<div class="score">${pontos}/20</div>
<p>${pct}% de acertos</p>
<br>
<button onclick="location.reload()">🔄 Jogar novamente</button>
`;

await salvar();
await ranking();
}

carregar();

</script>

</body>
</html>
