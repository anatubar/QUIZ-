<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💜 Quiz da Ana Beatriz 💜</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#7b2ff7,#4a00e0);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
background:white;
width:100%;
max-width:800px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
text-align:center;
color:#6a11cb;
margin-bottom:10px;
}

.sub{
text-align:center;
color:#666;
margin-bottom:20px;
}

#progress{
height:12px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

#bar{
height:100%;
width:0%;
background:#6a11cb;
transition:.3s;
}

#question{
margin-bottom:20px;
font-size:1.4rem;
color:#333;
}

button{
width:100%;
padding:15px;
margin:8px 0;
border:none;
border-radius:12px;
background:#f2f2f2;
cursor:pointer;
font-size:1rem;
transition:.3s;
}

button:hover{
background:#6a11cb;
color:white;
transform:scale(1.02);
}

.hidden{
display:none;
}

.score{
font-size:3rem;
color:#6a11cb;
margin:15px 0;
}

</style>
</head>

<body>

<div class="container">

<h1>💜 Quiz da Ana Beatriz 💜</h1>

<p class="sub">Será que você me conhece bem?</p>

<div id="quiz">

<div id="progress">
<div id="bar"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

</div>

<div id="result" class="hidden"></div>

<div id="ranking" class="hidden"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAoySl6K2YNWrdxI03a6ZKRFJ9Fnsy73M",
authDomain: "quiz-da-bia.firebaseapp.com",
projectId: "quiz-da-bia",
storageBucket: "quiz-da-bia.firebasestorage.app",
messagingSenderId: "149961986529",
appId: "1:149961986529:web:dcee62b751115bdc8bc2a0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// QUIZ
let atual = 0;
let pontos = 0;
let nome = prompt("Qual é seu nome? 💜") || "Anônimo";

const perguntas = [
{
pergunta:"Qual é o meu nome?",
opcoes:["Ana Beatriz","Maria","Julia","Fernanda"],
correta:"Ana Beatriz"
},
{
pergunta:"Quantos anos eu tenho?",
opcoes:["15","16","17","18"],
correta:"16"
},
{
pergunta:"Em qual cidade eu moro?",
opcoes:["São Paulo","Campinas","Osasco","Santos"],
correta:"São Paulo"
}
];

function carregarPergunta(){

const pergunta = perguntas[atual];

document.getElementById("question").innerHTML =
`(${atual + 1}/${perguntas.length}) ${pergunta.pergunta}`;

document.getElementById("bar").style.width =
`${(atual/perguntas.length)*100}%`;

const answers = document.getElementById("answers");
answers.innerHTML = "";

pergunta.opcoes.forEach(opcao => {

const botao = document.createElement("button");
botao.innerText = opcao;

botao.onclick = () => responder(opcao);

answers.appendChild(botao);

});

}

function responder(opcao){

if(opcao === perguntas[atual].correta){
pontos++;
}

atual++;

if(atual < perguntas.length){
carregarPergunta();
}else{
mostrarResultado();
}

}

async function salvar(){

await addDoc(collection(db,"ranking"),{
nome,
pontos,
porcentagem: Math.round((pontos/perguntas.length)*100),
data:new Date()
});

}

async function carregarRanking(){

const q = query(
collection(db,"ranking"),
orderBy("pontos","desc"),
limit(10)
);

const snap = await getDocs(q);

let html = "<h2>🏆 Ranking Top 10</h2>";

let pos = 1;

snap.forEach(doc => {

const d = doc.data();

html += `<p>${pos}. ${d.nome} — ${d.pontos}/${perguntas.length} (${d.porcentagem}%)</p>`;

pos++;

});

document.getElementById("ranking").innerHTML = html;
document.getElementById("ranking").classList.remove("hidden");

}

async function mostrarResultado(){

document.getElementById("quiz").classList.add("hidden");

const porcentagem = Math.round((pontos/perguntas.length)*100);

document.getElementById("result").classList.remove("hidden");

document.getElementById("result").innerHTML = `
<h2>🎉 Resultado</h2>

<div class="score">${pontos}/${perguntas.length}</div>

<p>${porcentagem}% de acertos</p>

<button onclick="location.reload()">🔄 Jogar novamente</button>
`;

await salvar();
await carregarRanking();

}

carregarPergunta();

</script>

</body>
</html>
