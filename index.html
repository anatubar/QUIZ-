<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Ana Beatriz 💜</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#7b2ff7,#4a00e0);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:95%;
max-width:800px;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{text-align:center;color:#6a11cb}

button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
cursor:pointer;
background:#eee;
transition:.2s;
}

button:hover{
transform:scale(1.02);
background:#6a11cb;
color:white;
}

.correct{background:#2ecc71!important;color:white}
.wrong{background:#e74c3c!important;color:white}

.hidden{display:none}

.score{font-size:2.5rem;text-align:center;color:#6a11cb}

.item{padding:5px;border-bottom:1px solid #eee}
</style>
</head>

<body>

<div class="container">

<h1>💜 Quiz da Ana Beatriz 💜</h1>

<div id="start">
<button onclick="iniciar()">▶ Jogar</button>
</div>

<div id="quiz" class="hidden">
<h2 id="question"></h2>
<div id="answers"></div>
</div>

<div id="result" class="hidden"></div>
<div id="errors" class="hidden"></div>
<div id="ranking" class="hidden"></div>
  
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
limit
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCKXTIiDgp00_KybUtxG539w3PUk7muElk",
  authDomain: "quiz-b898c.firebaseapp.com",
  databaseURL: "https://quiz-b898c-default-rtdb.firebaseio.com",
  projectId: "quiz-b898c",
 storageBucket: "quiz-b898c.appspot.com",
  messagingSenderId: "530944594230",
  appId: "1:530944594230:web:675b1a350df74d3ee5e397",
  measurementId: "G-T8XRSNRCKR"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const somAcerto = new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);

const somErro = new Audio(
"https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
);

// nome
let nome = localStorage.getItem("nome");
if(!nome){
nome = prompt("Qual é seu nome? 💜") || "Anônimo";
localStorage.setItem("nome", nome);
}

// estado
let atual = 0;
let pontos = 0;
let respostas = [];

// perguntas completas (COM OPÇÕES REAIS)
const perguntas = [
{p:"Qual é o meu nome?", correta:"ana beatriz", op:["ana beatriz","bia","ana carla","beatriz"]},
{p:"Quantos anos eu tenho?", correta:"16", op:["14","15","16","17"]},
{p:"Em qual região eu moro?", correta:"zona leste", op:["zona sul","zona leste","centro","lugar nenhum"]},
{p:"Qual grupo de k-pop eu gosto?", correta:"bts", op:["exo","bts","txt","blackpink"]},
{p:"Com quantos anos fiz o enem?", correta:"15", op:["14","15","16","17"]},
{p:"qual é Minha cor favorita?", correta:"roxo", op:["azul","verde","roxo","preto"]},
{p:" qual é o Meu signo?", correta:"capricornio", op:["aries","touro","capricornio","leao"]},
{p:"Prefiro frio ou calor?", correta:"frio", op:["frio","calor","verao","tropical"]},
{p:"Qual rede social é minha favorita?", correta:"tiktok", op:["instagram","tiktok","twitter","facebook"]},
{p:"Quantos irmãos eu tenho?", correta:"4", op:["2","3","4","5"]},
{p:"Qual é o nome do meu pet?", correta:"enzo", op:["thor","enzo","max","luna"]},
{p:"Sou canhota ou destra?", correta:"canhota", op:["destra","canhota","ambidestra","nenhuma"]},
{p:"Os meus olhos são?", correta:"castanhos", op:["azuis","verdes","castanhos","pretos"]},
{p:"Prefiro série ou filme?", correta:"serie", op:["filme","serie","documentario","anime"]},
{p:"Ano que eu fiz o enem?", correta:"2025", op:["2024","2025","2026","2023"]},
{p:"Sou tímida ou extrovertida?", correta:"extrovertida", op:["timida","extrovertida","ambos","nenhum"]},
{p:"Qual é a minha matéria favorita?", correta:"matematica", op:["portugues","historia","matematica","biologia"]},
{p:"Em que ano do ensino médio eu estou?", correta:"2", op:["1","2","3","4"]},
{p:"qual é a Especialização de medicina que eu quero seguir?", correta:"neurologia", op:["cardiologia","neurologia","dermatologia","pediatria"]},
{p:"Qual é a cidade que eu moro?", correta:"sao paulo", op:["recife","sao paulo","manaus","fortaleza"]}
];

// iniciar
window.iniciar = function(){
document.getElementById("start").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");
carregar();
}

// carregar
function carregar(){
const q = perguntas[atual];

document.getElementById("question").innerText =
`(${atual+1}/${perguntas.length}) ${q.p}`;

const div = document.getElementById("answers");
div.innerHTML = "";

q.op.forEach(op=>{
const b = document.createElement("button");
b.innerText = op;
b.onclick = ()=>responder(op,b,q);
div.appendChild(b);
});
}

// responder
function responder(op,btn,q){

const certo = op.toLowerCase() === q.correta.toLowerCase();

respostas.push({pergunta:q.p,resposta:op,certo});

if(certo){
    pontos++;
    btn.classList.add("correct");
    somAcerto.currentTime = 0;
    somAcerto.play();
}else{
    btn.classList.add("wrong");
    somErro.currentTime = 0;
    somErro.play();
}

setTimeout(()=>{
atual++;
if(atual<perguntas.length) carregar();
else fim();
},500);
}

// salvar ranking
async function salvar(){

try{

await addDoc(collection(db,"ranking"),{
nome,
pontos,
porcentagem: Math.round((pontos/perguntas.length)*100),
tempo: Date.now()
});

console.log("Ranking salvo!");

}catch(e){

console.error("Erro ao salvar:", e);

}

}
// ranking
async function ranking(){

const q = query(
  collection(db,"ranking"),
  orderBy("pontos","desc"),
  orderBy("tempo","asc"),
  limit(10)
);
const snap = await getDocs(q);

let html="<h2>🏆 Ranking</h2>";
let pos=1;

snap.forEach(d=>{
const data=d.data();
let medal = pos===1?"🥇":pos===2?"🥈":pos===3?"🥉":"";

html+=`<div class="item">${medal} ${pos}. ${data.nome} — ${data.pontos}/${perguntas.length}</div>`;
pos++;
});

document.getElementById("ranking").innerHTML=html;
document.getElementById("ranking").classList.remove("hidden");
}

// erros
// erros
function mostrarErros(){

let html = "<h2>❌ Erros</h2>";

respostas.forEach(r => {

    if(!r.certo){

        const correta = perguntas.find(
            p => p.p === r.pergunta
        ).correta;

        html += `
        <div class="item">
            ❌ ${r.pergunta}<br>
            Sua resposta: ${r.resposta}<br>
            ✅ Resposta correta: ${correta}
        </div>
        `;
    }

});

document.getElementById("errors").innerHTML = html;
document.getElementById("errors").classList.remove("hidden");

}

// fim
async function fim(){

document.getElementById("quiz").classList.add("hidden");

const pct = Math.round((pontos/perguntas.length)*100);

document.getElementById("result").classList.remove("hidden");

document.getElementById("result").innerHTML=`
<h2>🎉 Final</h2>
<div class="score">${pontos}/${perguntas.length}</div>
<p>${pct}% de acertos</p>
<br>
<button onclick="location.reload()">🔄 Jogar novamente</button>
`;

mostrarErros();
await salvar();
await ranking();
}

</script>

</body>
</html>
