<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Ana Beatriz 💜</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#7b2ff7,#4a00e0);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:95%;
max-width:800px;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{text-align:center;color:#6a11cb}

button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
cursor:pointer;
background:#eee;
font-size:16px;
}

button:hover{
background:#6a11cb;
color:white;
transform:scale(1.02);
}

.correct{background:#2ecc71!important;color:white}
.wrong{background:#e74c3c!important;color:white}

.hidden{display:none}

.score{
font-size:2rem;
text-align:center;
color:#6a11cb;
}

.item{
padding:8px;
border-bottom:1px solid #eee;
}

#barra{
height:20px;
width:0%;
background:#6a11cb;
border-radius:20px;
transition:.4s;
}

#rankingBox{
margin-top:20px;
padding:10px;
border-radius:10px;
background:#f5f5f5;
}
</style>
</head>

<body>

<div class="container">

<h1>💜 Quiz da Ana Beatriz 💜</h1>

<div id="start">
<button onclick="iniciar()">▶ Jogar agora</button>
</div>

<div id="quiz" class="hidden">
<h2 id="question"></h2>
<div id="answers"></div>
</div>

<div style="width:100%;background:#ddd;border-radius:20px;margin:15px 0;">
<div id="barra"></div>
</div>

<div id="result" class="hidden"></div>

<!-- 🏆 RANKING FIXO -->
<div id="rankingBox">
<h2>🏆 Ranking Global</h2>
<div id="ranking">Carregando ranking...</div>
<button onclick="carregarRanking()">🔄 Atualizar ranking</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
limit
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "SUA-API-KEY",
  authDomain: "SEU-PROJETO.firebaseapp.com",
  projectId: "SEU-PROJETO",
  storageBucket: "SEU-PROJETO.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🎮 estado */
let atual = 0;
let pontos = 0;
let respostas = [];

/* 👤 nome */
let nome = localStorage.getItem("nome");
if(!nome){
nome = prompt("Qual é seu nome? 💜") || "Anônimo";
localStorage.setItem("nome", nome);
}

/* ❓ perguntas */
const perguntas = [
{p:"Qual é o meu nome?", correta:"ana beatriz", op:["ana beatriz","bia","beatriz","ana carla"]},
{p:"Quantos anos eu tenho?", correta:"16", op:["14","15","16","17"]},
{p:"Em qual região eu moro?", correta:"zona leste", op:["zona sul","zona leste","centro","norte"]},
{p:"Qual grupo de k-pop eu gosto?", correta:"bts", op:["exo","bts","txt","blackpink"]},
{p:"Com quantos anos fiz o enem?", correta:"15", op:["14","15","16","17"]},
{p:"Qual minha cor favorita?", correta:"roxo", op:["azul","verde","roxo","preto"]},
{p:"Qual meu signo?", correta:"capricornio", op:["aries","touro","capricornio","leao"]},
{p:"Prefiro frio ou calor?", correta:"frio", op:["frio","calor","verao","tropical"]},
{p:"Qual rede social favorita?", correta:"tiktok", op:["instagram","tiktok","twitter","facebook"]},
{p:"Quantos irmãos eu tenho?", correta:"4", op:["2","3","4","5"]},

{p:"Qual o nome do meu pet?", correta:"enzo", op:["thor","enzo","max","luna"]},
{p:"Sou canhota ou destra?", correta:"canhota", op:["destra","canhota","ambidestra","nenhuma"]},
{p:"Meus olhos são?", correta:"castanhos", op:["azuis","verdes","castanhos","pretos"]},
{p:"Prefiro série ou filme?", correta:"serie", op:["filme","serie","documentario","anime"]},
{p:"Ano do enem?", correta:"2025", op:["2024","2025","2026","2023"]},
{p:"Sou tímida ou extrovertida?", correta:"extrovertida", op:["timida","extrovertida","ambos","nenhum"]},
{p:"Matéria favorita?", correta:"matematica", op:["portugues","historia","matematica","biologia"]},
{p:"Ano escolar?", correta:"2", op:["1","2","3","4"]},
{p:"Especialização desejada?", correta:"neurologia", op:["cardiologia","neurologia","dermatologia","pediatria"]},
{p:"Cidade?", correta:"sao paulo", op:["recife","sao paulo","manaus","fortaleza"]}
];
/* ▶ iniciar */
window.iniciar = function(){
document.getElementById("start").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");
carregar();
};

/* 📌 carregar */
function carregar(){
const q = perguntas[atual];

document.getElementById("question").innerText =
`(${atual+1}/${perguntas.length}) ${q.p}`;

document.getElementById("barra").style.width =
((atual+1)/perguntas.length*100)+"%";

const div = document.getElementById("answers");
div.innerHTML = "";

q.op.forEach(op=>{
const b = document.createElement("button");
b.innerText = op;
b.onclick = ()=>responder(op,b,q);
div.appendChild(b);
});
}

/* 🎯 resposta */
function responder(op,btn,q){

const certo = op.toLowerCase() === q.correta.toLowerCase();

respostas.push({certo});

if(certo){
pontos++;
btn.classList.add("correct");
}else{
btn.classList.add("wrong");
}

setTimeout(()=>{
atual++;
if(atual<perguntas.length) carregar();
else fim();
},500);
}

/* 💾 salvar */
async function salvar(){
try{
await addDoc(collection(db,"ranking"),{
nome,
pontos,
tempo: Date.now()
});
}catch(e){
console.log("erro salvar:",e);
}
}

/* 🏆 CARREGAR RANKING (FORTE E INDEPENDENTE) */
window.carregarRanking = async function(){

const div = document.getElementById("ranking");
div.innerHTML = "Carregando...";

try{

const snap = await getDocs(collection(db,"ranking"));

let lista = [];

snap.forEach(doc=>{
lista.push(doc.data());
});

lista.sort((a,b)=>b.pontos - a.pontos);

let html = "";

lista.slice(0,10).forEach((d,i)=>{
let medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
html += `<div class="item">${medal} ${i+1}. ${d.nome} — ${d.pontos}</div>`;
});

div.innerHTML = html || "Sem dados ainda";

}catch(err){
div.innerHTML = "Erro ao carregar ranking ❌";
console.log(err);
}
};

/* 🎉 fim */
async function fim(){

document.getElementById("quiz").classList.add("hidden");

await salvar();
await carregarRanking();

document.getElementById("result").classList.remove("hidden");
document.getElementById("result").innerHTML=`
<h2>🎉 Fim de jogo</h2>
<div class="score">${pontos}/${perguntas.length}</div>
<button onclick="location.reload()">Jogar novamente</button>
`;

}

carregarRanking();

</script>

</body>
</html>
