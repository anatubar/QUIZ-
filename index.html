<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Ana Beatriz 💜</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#7b2ff7,#4a00e0);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:95%;
max-width:800px;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{text-align:center;color:#6a11cb}

button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
cursor:pointer;
background:#eee;
font-size:16px;
}

button:hover{
background:#6a11cb;
color:white;
transform:scale(1.02);
}

.correct{background:#2ecc71!important;color:white}
.wrong{background:#e74c3c!important;color:white}

.hidden{display:none}

.score{
font-size:2rem;
text-align:center;
color:#6a11cb;
}

.item{
padding:8px;
border-bottom:1px solid #eee;
}

#barra{
height:20px;
width:0%;
background:#6a11cb;
border-radius:20px;
transition:.4s;
}

#result,#errors,#rankingBox{
opacity:0;
transform:translateY(20px);
transition:all .5s ease;
}

.show{
opacity:1!important;
transform:translateY(0)!important;
}

.glow{
animation:glow 1s ease-in-out infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 10px #6a11cb;}
to{box-shadow:0 0 25px #6a11cb;}
}

.final-title{
font-size:2rem;
text-align:center;
color:#6a11cb;
}
</style>
</head>

<body>

<div class="container">

<h1>💜 Quiz da Ana Beatriz 💜</h1>

<div id="start">
<button onclick="iniciar()">▶ Jogar agora</button>
</div>

<div id="quiz" class="hidden">
<h2 id="question"></h2>
<div id="answers"></div>
</div>

<div style="width:100%;background:#ddd;border-radius:20px;margin:15px 0;">
<div id="barra"></div>
</div>

<div id="result" class="hidden"></div>
<div id="errors" class="hidden"></div>

<div id="rankingBox">
<h2>🏆 Ranking</h2>
<div id="ranking"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCKXTIiDgp00_KybUtxG539w3PUk7muElk",
  authDomain: "quiz-b898c.firebaseapp.com",
  databaseURL: "https://quiz-b898c-default-rtdb.firebaseio.com",
  projectId: "quiz-b898c",
  storageBucket: "quiz-b898c.firebasestorage.app",
  messagingSenderId: "530944594230",
  appId: "1:530944594230:web:675b1a350df74d3ee5e397",
  measurementId: "G-T8XRSNRCKR"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let atual=0;
let pontos=0;
let respostas=[];

let nome = localStorage.getItem("nome");
if(!nome){
  nome = prompt("Seu nome? 💜") || "Anônimo";
  localStorage.setItem("nome", nome);
}
const perguntas=[
{p:"Qual é o meu nome?", correta:"ana beatriz", op:["ana beatriz","bia","beatriz","ana carla"]},
{p:"Quantos anos eu tenho?", correta:"16", op:["14","15","16","17"]},
{p:"Em qual região eu moro?", correta:"zona leste", op:["zona sul","zona leste","centro","norte"]},
{p:"Qual grupo de k-pop eu gosto?", correta:"bts", op:["exo","bts","txt","blackpink"]},
{p:"Com quantos anos fiz o enem?", correta:"15", op:["14","15","16","17"]},
{p:"Qual minha cor favorita?", correta:"roxo", op:["azul","verde","roxo","preto"]},
{p:"Qual meu signo?", correta:"capricornio", op:["aries","touro","capricornio","leao"]},
{p:"Prefiro frio ou calor?", correta:"frio", op:["frio","calor","verao","tropical"]},
{p:"Qual rede social favorita?", correta:"tiktok", op:["instagram","tiktok","twitter","facebook"]},
{p:"Quantos irmãos eu tenho?", correta:"4", op:["2","3","4","5"]},
{p:"Qual o nome do meu pet?", correta:"enzo", op:["thor","enzo","max","luna"]},
{p:"Sou canhota ou destra?", correta:"canhota", op:["destra","canhota","ambidestra","nenhuma"]},
{p:"Meus olhos são?", correta:"castanhos", op:["azuis","verdes","castanhos","pretos"]},
{p:"Prefiro série ou filme?", correta:"serie", op:["filme","serie","documentario","anime"]},
{p:"Ano do enem?", correta:"2025", op:["2024","2025","2026","2023"]},
{p:"Sou tímida ou extrovertida?", correta:"extrovertida", op:["timida","extrovertida","ambos","nenhum"]},
{p:"Matéria favorita?", correta:"matematica", op:["portugues","historia","matematica","biologia"]},
{p:"Ano escolar?", correta:"2", op:["1","2","3","4"]},
{p:"Especialização?", correta:"neurologia", op:["cardiologia","neurologia","dermatologia","pediatria"]},
{p:"Cidade?", correta:"sao paulo", op:["recife","sao paulo","manaus","fortaleza"]}
];

window.iniciar=()=>{
document.getElementById("start").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");
carregar();
}

function carregar(){
let q=perguntas[atual];
document.getElementById("question").innerText=`(${atual+1}/${perguntas.length}) ${q.p}`;
document.getElementById("barra").style.width=((atual+1)/perguntas.length*100)+"%";

let div=document.getElementById("answers");
div.innerHTML="";

q.op.forEach(op=>{
let b=document.createElement("button");
b.innerText=op;
b.onclick=()=>responder(op,b,q);
div.appendChild(b);
});
}
function responder(op,btn,q){
let certo = op.toLowerCase() === q.correta.toLowerCase();
respostas.push({certo});

if(certo){
pontos++;
btn.classList.add("correct");
}else{
btn.classList.add("wrong");
}

setTimeout(()=>{
atual++;
if(atual<perguntas.length)carregar();
else fim();
},400);
}

async function salvar(){
try{
await addDoc(collection(db,"ranking"),{
nome,
pontos,
tempo:Date.now()
});
}catch(e){
console.log("erro Firebase:", e);
}
}
function mostrarErros(){
let html="<h2 class='final-title'>❌ Revisão dos erros</h2>";
let teve=false;

respostas.forEach((r,i)=>{
if(!r.certo){
teve=true;
let q=perguntas[i];

html+=`
<div class='item'>
❌ <b>${q.p}</b><br>
✔ Resposta certa: <b>${q.correta}</b>
</div>
`;
}
});

if(!teve){
html+="<p style='text-align:center;color:#2ecc71;font-weight:bold'>🎉 Perfeito! Sem erros</p>";
}

const box = document.getElementById("errors");
box.innerHTML = html;

// só isso já resolve tudo visualmente
box.classList.add("show");
}
async function carregarRanking(){
let snap=await getDocs(collection(db,"ranking"));
let lista=[];
snap.forEach(d=>lista.push(d.data()));

lista.sort((a,b)=>b.pontos-a.pontos);

let html="";
lista.slice(0,10).forEach((d,i)=>{
let m=i==0?"🥇":i==1?"🥈":i==2?"🥉":"";
html+=`<div class='item'>${m} ${d.nome} - ${d.pontos}</div>`;
});

document.getElementById("ranking").innerHTML=html;
}

async function fim(){
document.getElementById("quiz").classList.add("hidden");
await salvar();

let pct=Math.round((pontos/perguntas.length)*100);

let result=document.getElementById("result");
result.classList.remove("hidden");
result.classList.add("show","glow");

result.innerHTML=`
<div class="final-title">FIM DE JOGO</div>
<h2>${pontos}/${perguntas.length}</h2>
<p>${pct}%</p>
<button onclick="location.reload()">Jogar de novo</button>
`;

setTimeout(()=>{
mostrarErros();
document.getElementById("errors").classList.add("show");
},600);

setTimeout(()=>{
carregarRanking();
const err = document.getElementById("errors");
err.style.display = "block";
err.classList.add("show");
},1200);
}

carregarRanking();

</script>

</body>
</html>
