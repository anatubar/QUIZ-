<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Ana Beatriz 💜</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#7b2ff7,#4a00e0);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:95%;
max-width:800px;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{text-align:center;color:#6a11cb}

button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
cursor:pointer;
background:#eee;
transition:.2s;
}

button:hover{transform:scale(1.02);background:#6a11cb;color:white}

.correct{background:#2ecc71!important;color:white}
.wrong{background:#e74c3c!important;color:white}

.hidden{display:none}

.score{font-size:2.5rem;text-align:center;color:#6a11cb}

.item{padding:5px;border-bottom:1px solid #eee}
</style>
</head>

<body>

<div class="container">

<h1>💜 Quiz da Ana Beatriz 💜</h1>

<div id="start">
<button onclick="iniciar()">▶ Jogar</button>
</div>

<div id="quiz" class="hidden">
<h2 id="question"></h2>
<div id="answers"></div>
</div>

<div id="result" class="hidden"></div>
<div id="errors" class="hidden"></div>
<div id="ranking" class="hidden"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
limit
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "COLOQUE_SUA_API_KEY",
authDomain: "quiz-da-bia.firebaseapp.com",
projectId: "quiz-da-bia",
storageBucket: "quiz-da-bia.appspot.com",
messagingSenderId: "149961986529",
appId: "COLOQUE_SEU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// nome
let nome = localStorage.getItem("nome");
if(!nome){
nome = prompt("Qual é seu nome? 💜") || "Anônimo";
localStorage.setItem("nome", nome);
}

// estado
let atual = 0;
let pontos = 0;
let respostas = [];

// perguntas (20 completas)
const perguntas = [
{p:"Qual é o meu nome?",c:["ana beatriz","ana","ana b"]},
{p:"Quantos anos eu tenho?",c:["16","dezesseis"]},
{p:"Em qual cidade eu moro?",c:["sao paulo","sp"]},
{p:"Em qual região eu moro?",c:["zona leste","zl"]},
{p:"Em qual ano do ensino médio eu estou?",c:["2","segundo"]},
{p:"Qual área da medicina eu quero?",c:["neurologia"]},
{p:"Qual matéria eu gosto?",c:["matematica"]},
{p:"Qual grupo de k-pop eu gosto?",c:["bts"]},
{p:"Com quantos anos fiz o enem?",c:["15"]},
{p:"Minha cor favorita?",c:["roxo","lilas"]},
{p:"Meu signo?",c:["capricornio"]},
{p:"Prefiro frio ou calor?",c:["frio"]},
{p:"Qual rede social favorita?",c:["tiktok"]},
{p:"Quantos irmãos tenho?",c:["4"]},
{p:"Meu pet chama?",c:["enzo"]},
{p:"Sou canhota ou destra?",c:["canhota"]},
{p:"Olhos são?",c:["castanho","castanhos"]},
{p:"Prefiro série ou filme?",c:["serie"]},
{p:"Ano do enem?",c:["15"]},
{p:"Sou tímida ou extrovertida?",c:["timida","extrovertida"]}
];

function iniciar(){
document.getElementById("start").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");
carregar();
}

function carregar(){
const q = perguntas[atual];

document.getElementById("question").innerText =
`(${atual+1}/${perguntas.length}) ${q.p}`;

const div = document.getElementById("answers");
div.innerHTML = "";

q.c.forEach(op=>{
const b = document.createElement("button");
b.innerText = op;
b.onclick = ()=>responder(op,b,q);
div.appendChild(b);
});
}

function responder(op,btn,q){

const certo = q.c.some(r=>r.toLowerCase()===op.toLowerCase());

respostas.push({pergunta:q.p,resposta:op,certo});

if(certo){
pontos++;
btn.classList.add("correct");
}else{
btn.classList.add("wrong");
}

setTimeout(()=>{
atual++;
if(atual<perguntas.length) carregar();
else fim();
},500);
}

async function salvar(){
await addDoc(collection(db,"ranking"),{
nome,
pontos,
porcentagem: Math.round((pontos/perguntas.length)*100),
tempo: Date.now()
});
}

async function ranking(){

const q = query(collection(db,"ranking"),orderBy("pontos","desc"),limit(10));
const snap = await getDocs(q);

let html="<h2>🏆 Ranking</h2>";
let pos=1;

snap.forEach(d=>{
const data=d.data();
let medal = pos===1?"🥇":pos===2?"🥈":pos===3?"🥉":"";
html+=`<div class="item">${medal} ${pos}. ${data.nome} — ${data.pontos}/${perguntas.length}</div>`;
pos++;
});

document.getElementById("ranking").innerHTML=html;
document.getElementById("ranking").classList.remove("hidden");
}

function mostrarErros(){
let html="<h2>❌ Erros</h2>";

respostas.forEach(r=>{
if(!r.certo){
html+=`<div class="item">❌ ${r.pergunta} → ${r.resposta}</div>`;
}
});

document.getElementById("errors").innerHTML=html;
document.getElementById("errors").classList.remove("hidden");
}

async function fim(){

document.getElementById("quiz").classList.add("hidden");

const pct=Math.round((pontos/perguntas.length)*100);

document.getElementById("result").classList.remove("hidden");

document.getElementById("result").innerHTML=`
<h2>🎉 Final</h2>
<div class="score">${pontos}/${perguntas.length}</div>
<p>${pct}% de acertos</p>
<br>
<button onclick="location.reload()">🔄 Jogar novamente</button>
`;

mostrarErros();
await salvar();
await ranking();
}

window.iniciar = iniciar;

</script>

</body>
</html>
